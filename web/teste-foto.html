<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teste de foto (sem Flutter)</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #1a1a1a; color: #eee; padding: 16px; }
  h1 { font-size: 18px; }
  button { font-size: 18px; padding: 14px 20px; border-radius: 10px; border: none; background: #B04E1C; color: white; width: 100%; }
  #log { margin-top: 16px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; background: #000; padding: 12px; border-radius: 8px; min-height: 200px; }
  .ok { color: #7CFC7C; }
  .err { color: #FF6B6B; }
  .warn { color: #FFD166; }
  img { max-width: 100%; margin-top: 12px; border-radius: 8px; }
</style>
</head>
<body>
  <h1>Teste de foto — JS puro, sem Flutter</h1>
  <p>Escolhe a mesma foto que trava no app. Cada linha abaixo aparece em tempo real, com o tempo decorrido — assim vemos exatamente em qual passo trava.</p>
  <button id="pick">Escolher foto</button>
  <input id="file" type="file" accept="image/*,image/heic" style="display:none" />
  <div id="log"></div>
  <img id="preview" style="display:none" />

<script>
  const logEl = document.getElementById('log');
  const t0 = performance.now();
  function log(msg, cls) {
    const t = ((performance.now() - t0) / 1000).toFixed(2);
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = `[${t}s] ${msg}`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  document.getElementById('pick').addEventListener('click', () => {
    logEl.innerHTML = '';
    document.getElementById('file').click();
  });

  document.getElementById('file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) { log('nenhum arquivo escolhido', 'warn'); return; }
    log(`arquivo escolhido: ${file.name || '(sem nome)'} · tipo: ${file.type || '(vazio)'} · ${(file.size / 1024 / 1024).toFixed(2)} MB`, 'ok');

    let objectUrl;
    try {
      objectUrl = URL.createObjectURL(file);
      log('URL.createObjectURL ok, criando <img>...', 'ok');

      const img = new Image();
      const loaded = new Promise((resolve, reject) => {
        img.onload = () => { log(`img.onload disparou! (${img.naturalWidth}x${img.naturalHeight})`, 'ok'); resolve(); };
        img.onerror = (ev) => { log('img.onerror disparou: ' + ev, 'err'); reject(new Error('onerror')); };
      });
      img.src = objectUrl;
      log('aguardando img.onload ou img.onerror (timeout manual de 15s)...');

      const timeout = new Promise((_, reject) =>
        setTimeout(() => reject(new Error('TIMEOUT: nem onload nem onerror dispararam em 15s')), 15000)
      );
      await Promise.race([loaded, timeout]);

      document.getElementById('preview').src = objectUrl;
      document.getElementById('preview').style.display = 'block';

      log('desenhando no canvas...');
      const canvas = document.createElement('canvas');
      const maxSide = 1600;
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      log(`canvas desenhado: ${canvas.width}x${canvas.height}`, 'ok');

      log('gerando blob (toBlob, webp)...');
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/webp', 0.82));
      if (blob) {
        log(`blob gerado! tipo: ${blob.type} · ${(blob.size / 1024).toFixed(0)} KB`, 'ok');
      } else {
        log('toBlob devolveu null (webp não suportado, tentando jpeg)', 'warn');
        const blob2 = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
        log(blob2 ? `blob jpeg gerado! ${(blob2.size / 1024).toFixed(0)} KB` : 'jpeg também falhou', blob2 ? 'ok' : 'err');
      }
      log('CONCLUÍDO COM SUCESSO', 'ok');
    } catch (err) {
      log('ERRO: ' + (err && err.message ? err.message : err), 'err');
    } finally {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
    }
  });
</script>
</body>
</html>
