<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Substituído pelo valor de `--base-href` no `flutter build`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Moda feminina e masculina. Escolha suas peças e finalize o pedido pelo WhatsApp.">
  <meta name="theme-color" content="#FFF8F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1A22" media="(prefers-color-scheme: dark)">

  <!--
    Preview do link no WhatsApp / Instagram (ADR-0001).
    og:image precisa de URL ABSOLUTA: trocar pelo domínio final no PR-11 (deploy).
  -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Ondas que Faltam">
  <meta property="og:title" content="Ondas que Faltam">
  <meta property="og:description" content="Moda feminina e masculina. Escolha suas peças e finalize o pedido pelo WhatsApp.">
  <meta property="og:image" content="icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ondas que Faltam">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Ondas que Faltam</title>

  <!--
    Splash em HTML puro: aparece instantaneamente enquanto o Flutter carrega
    (importante no navegador do Instagram). Removido no evento `flutter-first-frame`.
  -->
  <style>
    :root { --splash-bg: #FFF8F3; --splash-fg: #3D3A4B; --splash-dot: #F4A7B9; }
    @media (prefers-color-scheme: dark) {
      :root { --splash-bg: #1C1A22; --splash-fg: #EDE7F0; --splash-dot: #F4A7B9; }
    }
    html, body { margin: 0; height: 100%; background: var(--splash-bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: var(--splash-bg); color: var(--splash-fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .25s ease; z-index: 9999;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 132px; height: 132px; }
    #splash .dots { display: flex; gap: 8px; }
    #splash .dots span {
      width: 10px; height: 10px; border-radius: 50%; background: var(--splash-dot);
      animation: pulse 1s infinite ease-in-out;
    }
    #splash .dots span:nth-child(2) { animation-delay: .15s; background: #A7C7E7; }
    #splash .dots span:nth-child(3) { animation-delay: .3s; background: #B5E5CF; }
    @keyframes pulse { 0%, 100% { transform: scale(.6); opacity: .5; } 50% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #splash .dots span { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Carregando a loja">
    <img src="icons/Icon-192.png" alt="Ondas que Faltam" width="132" height="132">
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
